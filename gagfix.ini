; GAG Modern - настройки / settings
; Этот файл лежит рядом с GagModern.exe. / This file lives next to GagModern.exe.

[display]
; fullscreen = полноэкранный режим без смены разрешения (borderless) / borderless fullscreen
; windowed   = игра в окне / windowed
; Alt+Enter и кнопка игры "Полный экран / Вид в окне" переключают режим и сохраняют его сюда.
; Alt+Enter and the game's own "Full screen / Window" option switch modes and save the choice here.
mode=fullscreen

; Масштаб окна в оконном режиме: 1 = 640x480, 2 = 1280x960, 3 = 1920x1440 ...
; 0 = самый большой целый масштаб, который помещается на экран.
; Window scale in windowed mode (0 = largest whole multiple that fits the screen).
window_scale=0

; keep    = сохранять пропорции 4:3 (чёрные полосы по бокам) / keep 4:3 aspect ratio
; integer = только целый масштаб (идеально чёткие пиксели) / whole-number scaling only (pixel perfect)
; stretch = растянуть на весь экран / stretch to fill
aspect=keep

; nearest = чёткие пиксели / sharp pixels
; smooth  = сглаживание / smooth (halftone) filtering
filter=nearest

; Alt+Enter переключает полный экран / окно (1 = да, 0 = нет)
alt_enter=1

[debug]
; 1 = писать gagfix.log рядом с игрой / write gagfix.log next to the game
log=0
